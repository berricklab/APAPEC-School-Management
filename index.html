<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
APAPEC-IREBERO | School Management System
</title>

<style>

:root{
    --primary:#1e3a8a;
    --secondary:#2563eb;
    --accent:#10b981;
    --danger:#ef4444;
    --dark:#0f172a;
    --light:#f8fafc;
    --surface:#ffffff;
    --text:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f1f5f9;
    color:var(--text);
}

.dark-mode{
    background:#0f172a;
    color:white;
}

.dark-mode .content-panel,
.dark-mode .stat-card,
.dark-mode header{
    background:#1e293b;
    color:white;
}

#login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    linear-gradient(rgba(15,23,42,.8),rgba(15,23,42,.8)),
    linear-gradient(135deg,var(--primary),var(--secondary));
    padding:30px;
}

.auth-card{
    width:100%;
    max-width:550px;
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:var(--shadow);
}

.auth-header{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.form-control{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:2px solid #ddd;
}

.btn-auth,
.btn-action{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color:white;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

#app-container{
    display:none;
}

aside{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:250px;
    background:linear-gradient(
        180deg,
        var(--dark),
        var(--primary)
    );
    color:white;
    padding:20px;
}

aside h2{
    text-align:center;
    margin-bottom:30px;
}

.menu-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    background:rgba(255,255,255,.1);
    color:white;
    text-align:left;
}

header{
    position:fixed;
    top:0;
    left:250px;
    right:0;
    height:80px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

header button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:var(--danger);
    margin-left:10px;
}

main{
    margin-left:250px;
    margin-top:80px;
    padding:30px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.stat-card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.content-panel{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.table th{
    background:var(--primary);
    color:white;
    padding:14px;
}

.table td{
    padding:14px;
    border-bottom:1px solid #ddd;
}

.page-section{
    display:none;
}

.page-section.active{
    display:block;
}

@media(max-width:900px){

aside{
    position:relative;
    width:100%;
}

header{
    left:0;
}

main{
    margin-left:0;
}

}

</style>
</head>

<body>

<div id="login-screen">

<div class="auth-card">

<!-- SCHOOL REGISTRATION -->

<div id="school-registration-view">

<div class="auth-header">
<h1>Register School</h1>
<p>Create school before account</p>
</div>

<form onsubmit="registerSchool(event)">

<div class="form-group">
<label>School Name</label>
<input type="text" id="schoolRegisterName" class="form-control" required>
</div>

<div class="form-group">
<label>School Email</label>
<input type="email" id="schoolRegisterEmail" class="form-control" required>
</div>

<div class="form-group">
<label>School Phone</label>
<input type="text" id="schoolRegisterPhone" class="form-control" required>
</div>

<div class="form-group">
<label>School Address</label>
<input type="text" id="schoolRegisterAddress" class="form-control" required>
</div>

<div class="form-group">
<label>Main Admin Secret Code</label>
<input type="text" id="schoolMainAdminCode" class="form-control" required>
</div>

<div class="form-group">
<label>Maximum Number Of Admins</label>
<input type="number" id="maxAdmins" class="form-control" required>
</div>

<button type="submit" class="btn-auth">
Register School
</button>

<button
type="button"
class="btn-auth"
onclick="openLoginPage()"
style="background:#059669;"
>
Already Have Account?
</button>

</form>

</div>

<!-- REGISTER -->

<div id="register-view" style="display:none;">

<div class="auth-header">
<h1>Create Account</h1>
</div>

<form onsubmit="registerUser(event)">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="registerFullName" class="form-control" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="registerEmail" class="form-control" required>
</div>

<div class="form-group">
<label>Username</label>
<input type="text" id="registerUsername" class="form-control" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="registerPassword" class="form-control" required>
</div>

<div class="form-group">
<label>Role</label>

<select id="registerRole" class="form-control">

<option value="admin">
Administrator
</option>

<option value="teacher">
Teacher
</option>

<option value="student">
Student
</option>

<option value="librarian">
Librarian
</option>

<option value="parent">
Parent
</option>

</select>

</div>

<div
class="form-group"
id="admin-secret-box"
style="display:none;"
>
<label>Main Admin Secret Code</label>

<input
type="text"
id="adminSecretCode"
class="form-control"
>

</div>

<button type="submit" class="btn-auth">
Create Account
</button>

</form>

</div>

<!-- LOGIN -->

<div id="signin-view" style="display:none;">

<div class="auth-header">
<h1>Login</h1>
</div>

<form onsubmit="executeSystemLogin(event)">

<div class="form-group">
<label>Username Or Email</label>

<input
type="text"
id="loginUser"
class="form-control"
required
>

</div>

<div class="form-group">
<label>Password</label>

<input
type="password"
id="loginPassword"
class="form-control"
required
>

</div>

<button type="submit" class="btn-auth">
Login
</button>

</form>

</div>

</div>

</div>

<!-- APP -->

<div id="app-container">

<aside>

<h2 id="sidebar-school-name">
School System
</h2>

<button class="menu-btn" onclick="switchTab('dashboard')">
Dashboard
</button>

<button class="menu-btn" onclick="switchTab('students')">
Students
</button>

</aside>

<header>

<h2 id="header-school-name">
Dashboard
</h2>

<div>

<span id="header-active-role-badge"></span>

<button onclick="toggleDarkMode()">
Dark Mode
</button>

<button onclick="logoutSystem()">
Logout
</button>

</div>

</header>

<main>

<section
id="dashboard-section"
class="page-section active"
>

<div class="dashboard-grid">

<div class="stat-card">
<h3>Students</h3>
<p id="students-count">0</p>
</div>

<div class="stat-card">
<h3>Admins</h3>
<p id="admins-count">0</p>
</div>

</div>

</section>

<section
id="students-section"
class="page-section"
>

<div class="content-panel">

<h2>Add Student</h2>

<form onsubmit="addStudent(event)">

<div class="form-group">
<label>Name</label>

<input
type="text"
id="studentName"
class="form-control"
required
>

</div>

<div class="form-group">
<label>Class</label>

<input
type="text"
id="studentClass"
class="form-control"
required
>

</div>

<div class="form-group">
<label>Gender</label>

<select
id="studentGender"
class="form-control"
>

<option>Male</option>
<option>Female</option>

</select>

</div>

<button type="submit" class="btn-action">
Add Student
</button>

</form>

<table class="table">

<thead>

<tr>
<th>Name</th>
<th>Class</th>
<th>Gender</th>
</tr>

</thead>

<tbody id="students-table-body"></tbody>

</table>

</div>

</section>

</main>

</div>

<script>

const SCHOOL_REGISTRY_KEY =
"sms_registered_schools";

const USERS_KEY =
"sms_users";

const STUDENTS_KEY =
"sms_students";

let currentLoggedInUser = null;

/* =========================
ROLE CHANGE
========================= */

document
.getElementById("registerRole")
.addEventListener("change", function(){

    if(this.value === "admin"){

        document.getElementById(
            "admin-secret-box"
        ).style.display = "block";

    }else{

        document.getElementById(
            "admin-secret-box"
        ).style.display = "none";
    }
});

/* =========================
DARK MODE
========================= */

function toggleDarkMode(){

    document.body.classList.toggle(
        "dark-mode"
    );
}

/* =========================
REGISTER SCHOOL
========================= */

function registerSchool(event){

    event.preventDefault();

    const schoolName =
    document.getElementById(
        "schoolRegisterName"
    ).value.trim();

    const schoolEmail =
    document.getElementById(
        "schoolRegisterEmail"
    ).value.trim();

    const schoolPhone =
    document.getElementById(
        "schoolRegisterPhone"
    ).value.trim();

    const schoolAddress =
    document.getElementById(
        "schoolRegisterAddress"
    ).value.trim();

    const mainAdminCode =
    document.getElementById(
        "schoolMainAdminCode"
    ).value.trim();

    const maxAdmins =
    parseInt(
        document.getElementById(
            "maxAdmins"
        ).value
    );

    let schools =
    JSON.parse(
        localStorage.getItem(
            SCHOOL_REGISTRY_KEY
        )
    ) || [];

    const existingSchool =
    schools.find(
        school =>
        school.schoolName.toLowerCase()
        ===
        schoolName.toLowerCase()
    );

    if(existingSchool){

        alert("School already exists.");
        return;
    }

    schools.push({

        schoolName,
        schoolEmail,
        schoolPhone,
        schoolAddress,
        mainAdminCode,
        maxAdmins

    });

    localStorage.setItem(
        SCHOOL_REGISTRY_KEY,
        JSON.stringify(schools)
    );

    alert(
        "School Registered Successfully"
    );

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";
}

/* =========================
REGISTER USER
========================= */

function registerUser(event){

    event.preventDefault();

    const fullName =
    document.getElementById("registerFullName").value.trim();

    const email =
    document.getElementById("registerEmail").value.trim();

    const username =
    document.getElementById("registerUsername").value.trim();

    const password =
    document.getElementById("registerPassword").value.trim();

    const role =
    document.getElementById("registerRole").value;

    const adminSecretCode =
    document.getElementById("adminSecretCode").value.trim();

    let schools =
    JSON.parse(localStorage.getItem(SCHOOL_REGISTRY_KEY)) || [];

    if(schools.length === 0){

        alert("Please register school first");
        return;
    }

    const school = schools[0];

    let users =
    JSON.parse(localStorage.getItem(USERS_KEY)) || [];

    /* =========================
       CHECK ADMINS
    ========================= */

    const admins =
    users.filter(user => user.role === "admin");

    if(role === "admin"){

        /* CHECK SECRET CODE */

        if(adminSecretCode !== school.mainAdminCode){

            alert(
                "Wrong Main Admin Secret Code"
            );

            return;
        }

        /* CHECK MAX ADMINS */

        if(admins.length >= school.maxAdmins){

            alert(
                "Maximum Admins Reached"
            );

            return;
        }
    }

    /* =========================
       CHECK DUPLICATES
    ========================= */

    const existingUser =
    users.find(user =>
        user.username === username ||
        user.email === email
    );

    if(existingUser){

        alert("User already exists");
        return;
    }

    /* =========================
       SAVE USER
    ========================= */

    users.push({

        fullName,
        email,
        username,
        password,
        role

    });

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    alert("Account Created Successfully");

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

    /* =====================
       ADMIN SECURITY
    ===================== */

    if(role === "admin"){

        const admins =
        users.filter(
            user => user.role === "admin"
        );

        if(
            adminSecretCode !==
            school.mainAdminCode
        ){

            alert(
                "Wrong Main Admin Secret Code"
            );

            return;
        }

        if(
            admins.length >=
            school.maxAdmins
        ){

            alert(
                "Maximum Admins Reached"
            );

            return;
        }
    }

    users.push({

        fullName,
        email,
        username,
        password,
        role

    });

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    alert(
        "Account Created Successfully"
    );

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

/* =========================
LOGIN
========================= */

function executeSystemLogin(event){

    event.preventDefault();

    const loginUser =
    document.getElementById(
        "loginUser"
    ).value.trim();

    const loginPassword =
    document.getElementById(
        "loginPassword"
    ).value.trim();

    let users =
    JSON.parse(
        localStorage.getItem(
            USERS_KEY
        )
    ) || [];

    const matchedUser =
    users.find(user =>

        (
            user.username === loginUser
            ||
            user.email === loginUser
        )

        &&

        user.password === loginPassword
    );

    if(!matchedUser){

        alert("Invalid Login");
        return;
    }

    currentLoggedInUser =
    matchedUser;

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "app-container"
    ).style.display = "block";

    document.getElementById(
        "header-active-role-badge"
    ).innerText =
    matchedUser.role;

    refreshDashboard();
}

/* =========================
OPEN LOGIN
========================= */

function openLoginPage(){

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

/* =========================
LOGOUT
========================= */

function logoutSystem(){

    document.getElementById(
        "app-container"
    ).style.display = "none";

    document.getElementById(
        "login-screen"
    ).style.display = "flex";

    document.getElementById(
        "signin-view"
    ).style.display = "block";

    document.getElementById(
        "register-view"
    ).style.display = "none";
}

/* =========================
SWITCH TAB
========================= */

function switchTab(tab){

    document
    .querySelectorAll(".page-section")
    .forEach(section => {

        section.classList.remove(
            "active"
        );
    });

    const selectedSection =
    document.getElementById(
        tab + "-section"
    );

    if(selectedSection){

        selectedSection.classList.add(
            "active"
        );
    }
}

/* =========================
ADD STUDENT
========================= */

function addStudent(event){

    event.preventDefault();

    if(
        !currentLoggedInUser
    ){

        alert("Login first.");
        return;
    }

    if(
        currentLoggedInUser.role !==
        "admin"
    ){

        alert(
            "Only Admin Can Add Students"
        );

        return;
    }

    const name =
    document.getElementById(
        "studentName"
    ).value.trim();

    const className =
    document.getElementById(
        "studentClass"
    ).value.trim();

    const gender =
    document.getElementById(
        "studentGender"
    ).value;

    let students =
    JSON.parse(
        localStorage.getItem(
            STUDENTS_KEY
        )
    ) || [];

    students.push({

        name,
        className,
        gender

    });

    localStorage.setItem(
        STUDENTS_KEY,
        JSON.stringify(students)
    );

    renderStudents();

    refreshDashboard();

    event.target.reset();

    alert(
        "Student Added Successfully"
    );
}

/* =========================
RENDER STUDENTS
========================= */

function renderStudents(){

    const table =
    document.getElementById(
        "students-table-body"
    );

    table.innerHTML = "";

    let students =
    JSON.parse(
        localStorage.getItem(
            STUDENTS_KEY
        )
    ) || [];

    students.forEach(student => {

        table.innerHTML += `
        <tr>
        <td>${student.name}</td>
        <td>${student.className}</td>
        <td>${student.gender}</td>
        </tr>
        `;
    });
}

/* =========================
REFRESH DASHBOARD
========================= */

function refreshDashboard(){

    let students =
    JSON.parse(
        localStorage.getItem(
            STUDENTS_KEY
        )
    ) || [];

    let users =
    JSON.parse(
        localStorage.getItem(
            USERS_KEY
        )
    ) || [];

    const admins =
    users.filter(
        user => user.role === "admin"
    );

    document.getElementById(
        "students-count"
    ).innerText =
    students.length;

    document.getElementById(
        "admins-count"
    ).innerText =
    admins.length;

    renderStudents();
}

</script>

</body>
</html>
