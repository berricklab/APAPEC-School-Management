<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="window-title">
APAPEC-IREBERO | School Management System
</title>

<style>

/* ===============================
   ROOT
================================== */

:root{
    --primary:#1e3a8a;
    --secondary:#2563eb;
    --accent:#10b981;
    --danger:#ef4444;
    --dark:#0f172a;
    --light:#f8fafc;
    --surface:#ffffff;
    --text:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.12);
}

/* ===============================
   GLOBAL
================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f8fafc;
    color:var(--text);
}

.page-section{
    display:none;
}

.page-section.active{
    display:block;
}

.form-group{
    margin-bottom:15px;
}

.form-control{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #dbeafe;
}

.btn-auth,
.btn-action{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
}

.table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.table th{
    background:var(--primary);
    color:#fff;
    padding:12px;
}

.table td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.content-panel{
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.dashboard-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.stat-card{
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.stat-card p{
    font-size:2rem;
    font-weight:bold;
}

/* ===============================
   LOGIN SCREEN
================================== */

#login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:500px;
    background:#fff;
    padding:35px;
    border-radius:25px;
}

.auth-header{
    text-align:center;
    margin-bottom:25px;
}

.auth-header h1{
    color:var(--primary);
}

/* ===============================
   APP
================================== */

#app-container{
    display:none;
}

aside{
    width:260px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    background:var(--dark);
    color:#fff;
    padding:20px;
}

.sidebar-menu{
    list-style:none;
}

.menu-btn{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:#fff;
    cursor:pointer;
}

.menu-btn.active{
    background:var(--secondary);
}

header{
    position:fixed;
    top:0;
    left:260px;
    right:0;
    height:80px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    box-shadow:var(--shadow);
}

main{
    margin-left:260px;
    margin-top:90px;
    padding:30px;
}

#header-active-role-badge{
    padding:8px 14px;
    border-radius:20px;
    background:var(--accent);
    color:#fff;
    margin-right:10px;
}

header button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:var(--danger);
    color:#fff;
    cursor:pointer;
}

</style>
</head>
<body>

<!-- ========================================= -->
<!-- LOGIN SCREEN -->
<!-- ========================================= -->

<div id="login-screen">

    <div class="auth-card">

        <!-- SCHOOL REGISTER -->

        <div id="school-registration-view">

            <div class="auth-header">

                <h1>
                    Register School
                </h1>

            </div>

            <form onsubmit="registerSchool(event)">

                <div class="form-group">
                    <input
                        type="text"
                        id="schoolRegisterName"
                        class="form-control"
                        placeholder="School Name"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="email"
                        id="schoolRegisterEmail"
                        class="form-control"
                        placeholder="School Email"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="text"
                        id="schoolRegisterPhone"
                        class="form-control"
                        placeholder="School Phone"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="text"
                        id="schoolRegisterAddress"
                        class="form-control"
                        placeholder="School Address"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Register School
                </button>

                <button
                    type="button"
                    class="btn-auth"
                    onclick="openExistingSchoolRegistration()"
                    style="
                        margin-top:15px;
                        background:#10b981;
                    "
                >
                    Already Registered School?
                </button>

                <button
                    type="button"
                    class="btn-auth"
                    onclick="openLoginPage()"
                    style="
                        margin-top:15px;
                        background:#f59e0b;
                    "
                >
                    Already Have Account?
                </button>

            </form>

        </div>

        <!-- USER REGISTER -->

        <div
            id="register-view"
            style="display:none;"
        >

            <div class="auth-header">

                <h1>
                    Create Account
                </h1>

                <p id="active-school-label"></p>

            </div>

            <form onsubmit="registerUser(event)">

                <div class="form-group">
                    <input
                        type="text"
                        id="registerFullName"
                        class="form-control"
                        placeholder="Full Name"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Email"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="text"
                        id="registerUsername"
                        class="form-control"
                        placeholder="Username"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Password"
                        required
                    >
                </div>

                <div class="form-group">

                    <select
                        id="registerRole"
                        class="form-control"
                    >

                        <option value="admin">
                            Administrator
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="librarian">
                            Librarian
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Create Account
                </button>

            </form>

        </div>

        <!-- LOGIN -->

        <div
            id="signin-view"
            style="display:none;"
        >

            <div class="auth-header">

                <h1>
                    Login
                </h1>

            </div>

            <form onsubmit="executeSystemLogin(event)">

                <div class="form-group">

                    <input
                        type="text"
                        id="loginUser"
                        class="form-control"
                        placeholder="Username or Email"
                        required
                    >

                </div>

                <div class="form-group">

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- APP -->
<!-- ========================================= -->

<div id="app-container">

    <aside>

        <h2 id="sidebar-school-name">
            School System
        </h2>

        <ul class="sidebar-menu">

            <li>
                <button
                    class="menu-btn active"
                    onclick="switchTab('dashboard')"
                >
                    Dashboard
                </button>
            </li>

            <li>
                <button
                    class="menu-btn"
                    onclick="switchTab('students')"
                >
                    Students
                </button>
            </li>

            <li>
                <button
                    class="menu-btn"
                    onclick="switchTab('library')"
                >
                    Library
                </button>
            </li>

            <li>
                <button
                    class="menu-btn"
                    onclick="switchTab('fees')"
                >
                    Fees
                </button>
            </li>

            <li>
                <button
                    class="menu-btn"
                    onclick="switchTab('grades')"
                >
                    Grade Book
                </button>
            </li>

        </ul>

    </aside>

    <header>

        <h2 id="header-school-name">
            Dashboard
        </h2>

        <div>

            <span id="header-active-role-badge">
                User
            </span>

            <button onclick="logoutSystem()">
                Logout
            </button>

        </div>

    </header>

    <main>

        <!-- DASHBOARD -->

        <section
            id="dashboard-section"
            class="page-section active"
        >

            <div class="dashboard-grid">

                <div class="stat-card">
                    <h3>Students</h3>
                    <p id="students-count">0</p>
                </div>

                <div class="stat-card">
                    <h3>Books</h3>
                    <p id="books-count">0</p>
                </div>

                <div class="stat-card">
                    <h3>Fees</h3>
                    <p id="fees-count">0</p>
                </div>

                <div class="stat-card">
                    <h3>Grades</h3>
                    <p id="grades-count">0</p>
                </div>

            </div>

        </section>

        <!-- STUDENTS -->

        <section
            id="students-section"
            class="page-section"
        >

            <div class="content-panel">

                <h2>
                    Students
                </h2>

                <form onsubmit="addStudent(event)">

                    <div class="form-group">
                        <input
                            type="text"
                            id="studentName"
                            class="form-control"
                            placeholder="Student Name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <input
                            type="email"
                            id="studentEmail"
                            class="form-control"
                            placeholder="Student Email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <input
                            type="text"
                            id="studentClass"
                            class="form-control"
                            placeholder="Class"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn-action"
                    >
                        Add Student
                    </button>

                </form>

                <table class="table">

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Class</th>
                        </tr>

                    </thead>

                    <tbody id="students-table-body">

                    </tbody>

                </table>

            </div>

        </section>

        <!-- LIBRARY -->

        <section
            id="library-section"
            class="page-section"
        >

            <div class="content-panel">

                <h2>
                    Library Catalog
                </h2>

                <form onsubmit="addBook(event)">

                    <div class="form-group">
                        <input
                            type="text"
                            id="bookTitle"
                            class="form-control"
                            placeholder="Book Title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <input
                            type="text"
                            id="bookAuthor"
                            class="form-control"
                            placeholder="Author"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <input
                            type="text"
                            id="bookCategory"
                            class="form-control"
                            placeholder="Category"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn-action"
                    >
                        Add Book
                    </button>

                </form>

                <table class="table">

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                        </tr>

                    </thead>

                    <tbody id="library-table-body">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script>

/* =========================================
   STORAGE KEYS
========================================= */

const SCHOOL_REGISTRY_KEY =
    "sms_registered_schools";

const USERS_KEY =
    "sms_users";

const ACTIVE_SCHOOL_KEY =
    "sms_active_school";

/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentSchoolName = "";
let currentLoggedInUser = null;

/* =========================================
   DATABASE
========================================= */

function createEmptySchoolDatabase(
    schoolName
){

    return{

        schoolName,

        students:[],
        books:[],
        fees:[],
        marks:[]
    };
}

function getSchoolIndex(){

    return JSON.parse(
        localStorage.getItem(
            "sms_school_index"
        )
    ) || {};
}

function saveSchoolIndex(index){

    localStorage.setItem(
        "sms_school_index",
        JSON.stringify(index)
    );
}

function loadSchoolData(schoolName){

    const schools =
        getSchoolIndex();

    if(!schools[schoolName]){

        schools[schoolName] =
            createEmptySchoolDatabase(
                schoolName
            );

        saveSchoolIndex(schools);
    }

    return schools[schoolName];
}

function saveSchoolData(
    schoolName,
    data
){

    const schools =
        getSchoolIndex();

    schools[schoolName] = data;

    saveSchoolIndex(schools);
}

/* =========================================
   REGISTER SCHOOL
========================================= */

function registerSchool(event){

    event.preventDefault();

    const schoolName =
        document.getElementById(
            "schoolRegisterName"
        ).value.trim();

    const schoolEmail =
        document.getElementById(
            "schoolRegisterEmail"
        ).value.trim();

    const schoolPhone =
        document.getElementById(
            "schoolRegisterPhone"
        ).value.trim();

    const schoolAddress =
        document.getElementById(
            "schoolRegisterAddress"
        ).value.trim();

    let schools =
        JSON.parse(
            localStorage.getItem(
                SCHOOL_REGISTRY_KEY
            )
        ) || [];

    schools.push({

        schoolName,
        schoolEmail,
        schoolPhone,
        schoolAddress
    });

    localStorage.setItem(
        SCHOOL_REGISTRY_KEY,
        JSON.stringify(schools)
    );

    currentSchoolName =
        schoolName;

    localStorage.setItem(
        ACTIVE_SCHOOL_KEY,
        currentSchoolName
    );

    const db =
        createEmptySchoolDatabase(
            currentSchoolName
        );

    saveSchoolData(
        currentSchoolName,
        db
    );

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";
}

/* =========================================
   EXISTING SCHOOL
========================================= */

function openExistingSchoolRegistration(){

    const school =
        prompt(
            "Enter school name"
        );

    if(!school){
        return;
    }

    currentSchoolName =
        school;

    localStorage.setItem(
        ACTIVE_SCHOOL_KEY,
        school
    );

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";
}

/* =========================================
   OPEN LOGIN
========================================= */

function openLoginPage(){

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

/* =========================================
   REGISTER USER
========================================= */

function registerUser(event){

    event.preventDefault();

    let users =
        JSON.parse(
            localStorage.getItem(
                USERS_KEY
            )
        ) || [];

    users.push({

        fullName:
            document.getElementById(
                "registerFullName"
            ).value,

        email:
            document.getElementById(
                "registerEmail"
            ).value,

        username:
            document.getElementById(
                "registerUsername"
            ).value,

        password:
            document.getElementById(
                "registerPassword"
            ).value,

        role:
            document.getElementById(
                "registerRole"
            ).value,

        school:
            currentSchoolName
    });

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    alert(
        "Account created successfully."
    );

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

/* =========================================
   LOGIN
========================================= */

function executeSystemLogin(event){

    event.preventDefault();

    const loginValue =
        document.getElementById(
            "loginUser"
        ).value;

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const users =
        JSON.parse(
            localStorage.getItem(
                USERS_KEY
            )
        ) || [];

    const matchedUser =
        users.find(
            user =>
                (
                    user.username === loginValue
                    ||
                    user.email === loginValue
                )
                &&
                user.password === password
        );

    if(!matchedUser){

        alert(
            "Invalid credentials"
        );

        return;
    }

    currentLoggedInUser =
        matchedUser;

    currentSchoolName =
        matchedUser.school;

    window.currentSchoolDatabase =
        loadSchoolData(
            currentSchoolName
        );

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "app-container"
    ).style.display = "block";

    document.getElementById(
        "header-active-role-badge"
    ).textContent =
        matchedUser.role;

    refreshEntireSystemUI();
}

/* =========================================
   SWITCH TAB
========================================= */

function switchTab(tab){

    document
        .querySelectorAll(".page-section")
        .forEach(section=>{

            section.classList.remove(
                "active"
            );

        });

    document
        .getElementById(
            tab + "-section"
        )
        .classList.add("active");
}

/* =========================================
   ADD STUDENT
========================================= */

function addStudent(event){

    event.preventDefault();

    if(
        currentLoggedInUser.role !==
        "admin"
    ){

        alert(
            "Only admin can add students."
        );

        return;
    }

    window.currentSchoolDatabase.students.push({

        name:
            document.getElementById(
                "studentName"
            ).value,

        email:
            document.getElementById(
                "studentEmail"
            ).value,

        className:
            document.getElementById(
                "studentClass"
            ).value
    });

    saveSchoolData(
        currentSchoolName,
        window.currentSchoolDatabase
    );

    refreshEntireSystemUI();

    event.target.reset();
}

/* =========================================
   ADD BOOK
========================================= */

function addBook(event){

    event.preventDefault();

    if(
        currentLoggedInUser.role !==
        "admin"
        &&
        currentLoggedInUser.role !==
        "librarian"
    ){

        alert(
            "Only admin or librarian can add books."
        );

        return;
    }

    window.currentSchoolDatabase.books.push({

        title:
            document.getElementById(
                "bookTitle"
            ).value,

        author:
            document.getElementById(
                "bookAuthor"
            ).value,

        category:
            document.getElementById(
                "bookCategory"
            ).value
    });

    saveSchoolData(
        currentSchoolName,
        window.currentSchoolDatabase
    );

    refreshEntireSystemUI();

    event.target.reset();
}

/* =========================================
   REFRESH UI
========================================= */

function refreshEntireSystemUI(){

    document.getElementById(
        "students-count"
    ).textContent =
        window.currentSchoolDatabase.students.length;

    document.getElementById(
        "books-count"
    ).textContent =
        window.currentSchoolDatabase.books.length;

    document.getElementById(
        "fees-count"
    ).textContent =
        window.currentSchoolDatabase.fees.length;

    document.getElementById(
        "grades-count"
    ).textContent =
        window.currentSchoolDatabase.marks.length;

    renderStudentsTable();

    renderBooksTable();

    document.getElementById(
        "sidebar-school-name"
    ).textContent =
        currentSchoolName;

    document.getElementById(
        "header-school-name"
    ).textContent =
        currentSchoolName;
}

/* =========================================
   STUDENT TABLE
========================================= */

function renderStudentsTable(){

    const tbody =
        document.getElementById(
            "students-table-body"
        );

    tbody.innerHTML = "";

    window.currentSchoolDatabase.students
    .forEach(student=>{

        tbody.innerHTML += `
            <tr>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td>${student.className}</td>
            </tr>
        `;
    });
}

/* =========================================
   BOOK TABLE
========================================= */

function renderBooksTable(){

    const tbody =
        document.getElementById(
            "library-table-body"
        );

    tbody.innerHTML = "";

    window.currentSchoolDatabase.books
    .forEach(book=>{

        tbody.innerHTML += `
            <tr>
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${book.category}</td>
            </tr>
        `;
    });
}

/* =========================================
   LOGOUT
========================================= */

function logoutSystem(){

    document.getElementById(
        "app-container"
    ).style.display = "none";

    document.getElementById(
        "login-screen"
    ).style.display = "flex";

    document.getElementById(
        "signin-view"
    ).style.display = "block";

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";
}

</script>

</body>
</html>
