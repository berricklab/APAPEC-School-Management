<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Management System</title>

<style>
:root{
    --primary:#1e3a8a;
    --secondary:#2563eb;
    --danger:#ef4444;
    --dark:#0f172a;
    --text:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.12);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{background:#f1f5f9;color:var(--text);}

.dark-mode{background:#0f172a;color:white;}

#login-screen{min-height:100vh;display:flex;justify-content:center;align-items:center;}

.auth-card{background:white;padding:30px;border-radius:15px;box-shadow:var(--shadow);width:100%;max-width:500px;}

.form-group{margin-bottom:10px;}

input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;}

button{padding:10px;border:none;border-radius:8px;cursor:pointer;}

.btn{background:var(--primary);color:white;width:100%;margin-top:10px;}

aside{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--dark);color:white;padding:15px;}

main{margin-left:220px;padding:20px;margin-top:60px;}

header{position:fixed;top:0;left:220px;right:0;height:60px;background:white;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;}

.page{display:none;}
.page.active{display:block;}

table{width:100%;margin-top:10px;border-collapse:collapse;}
td,th{border:1px solid #ddd;padding:8px;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
<div class="auth-card">

<h2>Login</h2>

<form onsubmit="login(event)">
<input id="loginUser" placeholder="username/email" required>
<input id="loginPass" type="password" placeholder="password" required>
<button class="btn">Login</button>
</form>

</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<aside>
<h3>School Panel</h3>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('students')">Students</button>
<button onclick="show('grades')">Grades</button>
<button onclick="show('ranking')">Ranking</button>
<button onclick="show('chat')">Chat</button>
<button onclick="show('chart')">Chart</button>
</aside>

<header>
<h3 id="roleText"></h3>
<button onclick="logout()">Logout</button>
</header>

<main>

<!-- DASHBOARD -->
<div id="dashboard" class="page active">
<h2>Dashboard</h2>
<p>Students: <span id="count"></span></p>
</div>

<!-- STUDENTS -->
<div id="students" class="page">

<h2>Add Student</h2>

<form onsubmit="addStudent(event)">
<input id="name" placeholder="name" required>
<input id="cls" placeholder="class" required>
<button class="btn">Add</button>
</form>

<table>
<thead><tr><th>Name</th><th>Class</th></tr></thead>
<tbody id="studentTable"></tbody>
</table>

</div>

<!-- GRADES -->
<div id="grades" class="page">

<h2>Add Grades (Math, Eng, Sci)</h2>

<input id="gname" placeholder="student name">
<input id="math" placeholder="Math">
<input id="eng" placeholder="English">
<input id="sci" placeholder="Science">

<button onclick="addGrades()">Save Grades</button>

</div>

<!-- RANKING -->
<div id="ranking" class="page">
<h2>Ranking</h2>
<ul id="rankList"></ul>
</div>

<!-- CHAT -->
<div id="chat" class="page">
<h2>Chat</h2>

<input id="msg" placeholder="message">
<button onclick="sendMsg()">Send</button>

<ul id="chatBox"></ul>
</div>

<!-- CHART -->
<div id="chart" class="page">
<h2>Performance Chart</h2>
<canvas id="chartBox"></canvas>
</div>

</main>
</div>

<script>

let user = null;

function login(e){
e.preventDefault();

let u = document.getElementById("loginUser").value;
let p = document.getElementById("loginPass").value;

user = {username:u, role:"admin"}; // simple auth

document.getElementById("login-screen").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("roleText").innerText = user.role;

renderStudents();
refresh();
}

function logout(){
location.reload();
}

let students = [];
let grades = [];
let chat = [];

function show(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(page).classList.add("active");
}

/* STUDENTS */
function addStudent(e){
e.preventDefault();

students.push({
name: name.value,
cls: cls.value
});

renderStudents();
refresh();
}

function renderStudents(){
studentTable.innerHTML = students.map(s=>
`<tr><td>${s.name}</td><td>${s.cls}</td></tr>`
).join("");
}

/* GRADES + AVERAGE */
function addGrades(){

let avg = (+math.value + +eng.value + +sci.value)/3;

grades.push({
name:gname.value,
math:+math.value,
eng:+eng.value,
sci:+sci.value,
avg
});

alert("Saved! Average = " + avg);

updateRanking();
drawChart();
}

/* RANKING */
function updateRanking(){

let sorted = [...grades].sort((a,b)=>b.avg-a.avg);

rankList.innerHTML = sorted.map(s=>
`<li>${s.name} - ${s.avg.toFixed(2)}</li>`
).join("");
}

/* CHAT */
function sendMsg(){
chat.push(msg.value);
chatBox.innerHTML = chat.map(m=>`<li>${m}</li>`).join("");
msg.value="";
}

/* CHART */
function drawChart(){

let ctx = document.getElementById("chartBox").getContext("2d");
ctx.clearRect(0,0,400,300);

grades.forEach((g,i)=>{
ctx.fillRect(i*40,200-g.avg*10,30,g.avg*10);
});
}

/* DASHBOARD */
function refresh(){
count.innerText = students.length;
}

</script>

</body>
</html>
