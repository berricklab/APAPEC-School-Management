
<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="window-title">APAPEC-IREBERO | School Management System</title>

<style>

/* ===============================
   ADVANCED ANIMATED SCHOOL SYSTEM
================================== */

:root{
    --primary:#1e3a8a;
    --secondary:#2563eb;
    --accent:#10b981;
    --danger:#ef4444;
    --dark:#0f172a;
    --light:#f8fafc;
    --surface:#ffffff;
    --text:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.12);
    --radius:18px;
}

/* ===============================
   GLOBAL
================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#eff6ff,#f8fafc);
    color:var(--text);
    overflow-x:hidden;
}

/* ===============================
   ANIMATIONS
================================== */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes slideLeft{
    from{
        transform:translateX(-40px);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

@keyframes pop{
    0%{
        transform:scale(.8);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 rgba(37,99,235,.4);
    }
    70%{
        box-shadow:0 0 0 20px rgba(37,99,235,0);
    }
    100%{
        box-shadow:0 0 0 rgba(37,99,235,0);
    }
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0);
    }
}

/* ===============================
   LOGIN SCREEN
================================== */

#login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.75)),
    linear-gradient(135deg,var(--primary),var(--secondary));
    padding:30px;
    position:relative;
    overflow:hidden;
}

#login-screen::before{
    content:"";
    width:500px;
    height:500px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    position:absolute;
    top:-200px;
    right:-150px;
    animation:float 6s infinite ease-in-out;
}

#login-screen::after{
    content:"";
    width:400px;
    height:400px;
    background:rgba(255,255,255,.05);
    border-radius:50%;
    position:absolute;
    bottom:-180px;
    left:-120px;
    animation:float 8s infinite ease-in-out;
}

.auth-card{
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:40px;
    box-shadow:var(--shadow);
    position:relative;
    z-index:5;
    animation:pop .7s ease;
}

.auth-header{
    text-align:center;
    margin-bottom:25px;
}

.auth-header h1{
    font-size:2rem;
    color:var(--primary);
    margin-bottom:10px;
}

.auth-header p{
    color:#64748b;
}

/* ===============================
   FORMS
================================== */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

.form-control{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:2px solid #e2e8f0;
    transition:.3s;
    font-size:15px;
    background:#fff;
}

.form-control:focus{
    border-color:var(--secondary);
    outline:none;
    box-shadow:0 0 0 5px rgba(37,99,235,.15);
    transform:translateY(-2px);
}

/* ===============================
   BUTTONS
================================== */

.btn-auth,
.btn-action{
    width:100%;
    border:none;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    transition:.3s;
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    position:relative;
    overflow:hidden;
}

.btn-auth:hover,
.btn-action:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 24px rgba(37,99,235,.25);
}

.btn-auth:active,
.btn-action:active{
    transform:scale(.98);
}

.btn-auth::before,
.btn-action::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.25);
    transition:.5s;
}

.btn-auth:hover::before,
.btn-action:hover::before{
    left:100%;
}

/* ===============================
   APP CONTAINER
================================== */

#app-container{
    display:none;
    animation:fadeIn .6s ease;
}

/* ===============================
   SIDEBAR
================================== */

aside{
    width:270px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    background:linear-gradient(
        180deg,
        var(--dark),
        var(--primary)
    );
    color:#fff;
    padding:25px;
    overflow-y:auto;
    animation:slideLeft .6s ease;
    box-shadow:5px 0 20px rgba(0,0,0,.1);
}

aside h2{
    text-align:center;
    margin-bottom:30px;
    font-size:1.7rem;
}

.sidebar-menu{
    list-style:none;
}

.menu-btn{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    text-align:left;
    font-weight:600;
    transition:.3s;
    position:relative;
}

.menu-btn:hover{
    background:rgba(255,255,255,.18);
    transform:translateX(8px);
}

.menu-btn.active{
    background:linear-gradient(
        135deg,
        var(--secondary),
        var(--accent)
    );
    animation:pulse 2s infinite;
}

/* ===============================
   HEADER
================================== */

header{
    position:fixed;
    top:0;
    left:270px;
    right:0;
    height:80px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    z-index:100;
}

header h2{
    color:var(--primary);
    font-size:1.5rem;
}

header button{
    padding:10px 20px;
    border:none;
    border-radius:12px;
    background:var(--danger);
    color:#fff;
    cursor:pointer;
    transition:.3s;
}

header button:hover{
    transform:translateY(-2px);
}

/* ===============================
   MAIN
================================== */

main{
    margin-left:270px;
    margin-top:80px;
    padding:35px;
}

/* ===============================
   DASHBOARD
================================== */

.dashboard-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.stat-card{
    background:var(--surface);
    border-radius:25px;
    padding:30px;
    box-shadow:var(--shadow);
    animation:fadeIn .6s ease;
    transition:.4s;
    position:relative;
    overflow:hidden;
}

.stat-card::before{
    content:"";
    width:120px;
    height:120px;
    background:rgba(37,99,235,.08);
    border-radius:50%;
    position:absolute;
    top:-40px;
    right:-30px;
}

.stat-card:hover{
    transform:translateY(-10px);
}

.stat-card h3{
    margin-bottom:15px;
    color:var(--primary);
}

.stat-card p{
    font-size:2rem;
    font-weight:800;
}

/* ===============================
   PANELS
================================== */

.content-panel{
    background:#fff;
    border-radius:25px;
    padding:30px;
    box-shadow:var(--shadow);
    animation:fadeIn .5s ease;
}

.content-panel h2{
    margin-bottom:20px;
    color:var(--primary);
}

/* ===============================
   TABLES
================================== */

.table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:16px;
    margin-top:20px;
}

.table th{
    background:var(--primary);
    color:#fff;
    padding:15px;
    text-align:left;
}

.table td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}

.table tr{
    transition:.3s;
}

.table tr:hover{
    background:#eff6ff;
    transform:scale(1.01);
}

/* ===============================
   PAGE SECTIONS
================================== */

.page-section{
    display:none;
    animation:fadeIn .5s ease;
}

.page-section.active{
    display:block;
}

/* ===============================
   BADGES
================================== */

#header-active-role-badge{
    padding:8px 16px;
    background:linear-gradient(
        135deg,
        var(--accent),
        #34d399
    );
    border-radius:30px;
    color:#fff;
    margin-right:15px;
    font-weight:700;
}

/* ===============================
   SCROLLBAR
================================== */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:var(--secondary);
    border-radius:10px;
}

/* ===============================
   RESPONSIVE
================================== */

@media(max-width:900px){

aside{
    width:100%;
    position:relative;
    height:auto;
}

header{
    left:0;
}

main{
    margin-left:0;
}

.dashboard-grid{
    grid-template-columns:1fr;
}

}

@media(max-width:600px){

.auth-card{
    padding:25px;
}

header{
    padding:0 15px;
}

main{
    padding:20px;
}

.stat-card{
    padding:20px;
}

}

</style>
</head>
<!-- ========================================= -->
<!-- LOGIN SCREEN -->
<!-- ========================================= -->

<div id="login-screen">

    <div class="auth-card">

        <div class="auth-header">
            <h1 id="login-brand-title">
                School Management System
            </h1>

            <p>
                Register your school before creating user accounts
            </p>
        </div>

        <!-- ========================================= -->
        <!-- STEP 1 : SCHOOL REGISTRATION -->
        <!-- ========================================= -->

        <div id="school-registration-view">

            <form onsubmit="registerSchool(event)">

                <div class="form-group">
                    <label>School Name</label>

                    <input
                        type="text"
                        id="schoolRegisterName"
                        class="form-control"
                        placeholder="Enter school name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>School Email</label>

                    <input
                        type="email"
                        id="schoolRegisterEmail"
                        class="form-control"
                        placeholder="Enter school email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>School Phone</label>

                    <input
                        type="text"
                        id="schoolRegisterPhone"
                        class="form-control"
                        placeholder="Enter school phone"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>School Address</label>

                    <input
                        type="text"
                        id="schoolRegisterAddress"
                        class="form-control"
                        placeholder="Enter school address"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Register School
                </button>

            </form>

            <br>

            <button
                class="btn-action"
                onclick="showLoginView()"
            >
                Already Registered? Login
            </button>

        </div>

        <!-- ========================================= -->
        <!-- STEP 2 : USER REGISTRATION -->
        <!-- ========================================= -->

        <div id="register-view" style="display:none;">

            <form onsubmit="registerUser(event)">

                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        id="registerFullName"
                        class="form-control"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        id="registerUsername"
                        class="form-control"
                        placeholder="Choose username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Role</label>

                    <select
                        id="registerRole"
                        class="form-control"
                        required
                    >
                        <option value="admin">
                            Administrator
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="librarian">
                            Librarian
                        </option>

                        <option value="parent">
                            Parent
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Create Permanent Account
                </button>

            </form>

        </div>

        <!-- ========================================= -->
        <!-- STEP 3 : LOGIN -->
        <!-- ========================================= -->

        <div id="signin-view" style="display:none;">

            <form onsubmit="executeSystemLogin(event)">

                <div class="form-group">
                    <label>
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginUser"
                        class="form-control"
                        placeholder="Enter username or email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-auth"
                >
                    Login
                </button>

            </form>

            <br>

            <button
                class="btn-action"
                onclick="showSchoolRegistration()"
            >
                Register New School
            </button>

        </div>

    </div>

</div>
<script>    
/* =========================================
   AUTHENTICATION SYSTEM
========================================= */

const SCHOOL_REGISTRY_KEY = "sms_registered_schools";
const USERS_KEY = "sms_users";

/* =========================================
   REGISTER SCHOOL
========================================= */

function registerSchool(event){

    event.preventDefault();

    const schoolName =
        document.getElementById(
            "schoolRegisterName"
        ).value.trim();

    const schoolEmail =
        document.getElementById(
            "schoolRegisterEmail"
        ).value.trim();

    const schoolPhone =
        document.getElementById(
            "schoolRegisterPhone"
        ).value.trim();

    const schoolAddress =
        document.getElementById(
            "schoolRegisterAddress"
        ).value.trim();

    if(
        !schoolName ||
        !schoolEmail ||
        !schoolPhone ||
        !schoolAddress
    ){
        alert("Fill all school fields");
        return;
    }

    let schools =
        JSON.parse(
            localStorage.getItem(
                "sms_registered_schools"
            )
        ) || [];

    const existingSchool =
        schools.find(
            school =>
                school.schoolName.toLowerCase()
                === schoolName.toLowerCase()
        );

    /* RESTORE EXISTING SCHOOL */
    if(existingSchool){

        currentSchoolName =
            existingSchool.schoolName;

        localStorage.setItem(
            "sms_active_school",
            currentSchoolName
        );

        window.currentSchoolDatabase =
            loadSchoolData(
                currentSchoolName
            );

        executeGlobalSchoolRebrand(
            currentSchoolName
        );

        alert(
            "School restored successfully"
        );

    }else{

        const schoolPayload = {

            schoolName,
            schoolEmail,
            schoolPhone,
            schoolAddress,

            createdAt:
                new Date().toISOString()
        };

        schools.push(schoolPayload);

        localStorage.setItem(
            "sms_registered_schools",
            JSON.stringify(schools)
        );

        currentSchoolName = schoolName;

        localStorage.setItem(
            "sms_active_school",
            currentSchoolName
        );

        window.currentSchoolDatabase =
            createEmptySchoolDatabase(
                currentSchoolName
            );

        saveSchoolData(
            currentSchoolName,
            window.currentSchoolDatabase
        );

        executeGlobalSchoolRebrand(
            currentSchoolName
        );

        alert(
            "School registered successfully"
        );
    }

    /* GO TO ACCOUNT REGISTRATION */
    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";

    document.getElementById(
        "active-school-label"
    ).textContent =
        "School: " + currentSchoolName;
}
   
   /* RESTORE SCHOOL */
    if(existingSchool){

        localStorage.setItem(
            ACTIVE_SCHOOL_KEY,
            existingSchool.schoolName
        );

        currentSchoolName =
            existingSchool.schoolName;

        window.currentSchoolDatabase =
            loadSchoolData(currentSchoolName);

        executeGlobalSchoolRebrand(
            currentSchoolName
        );

        alert(
            "Existing school restored successfully."
        );

    }else{

        const schoolPayload = {
            schoolName,
            schoolEmail,
            schoolPhone,
            schoolAddress,
            createdAt:
                new Date().toISOString()
        };

        schools.push(schoolPayload);

        localStorage.setItem(
            SCHOOL_REGISTRY_KEY,
            JSON.stringify(schools)
        );

        localStorage.setItem(
            ACTIVE_SCHOOL_KEY,
            schoolName
        );

        currentSchoolName = schoolName;

        window.currentSchoolDatabase =
            createEmptySchoolDatabase(
                schoolName
            );

        saveSchoolData(
            schoolName,
            window.currentSchoolDatabase
        );

        executeGlobalSchoolRebrand(
            schoolName
        );

        alert(
            "School registered successfully."
        );
    }

    /* NEXT STEP */
    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";

    document.getElementById(
        "active-school-label"
    ).textContent =
        "School: " + currentSchoolName;
}

/* =========================================
   REGISTER USER
========================================= */

function registerUser(event){

    event.preventDefault();

    const activeSchool =
        localStorage.getItem(
            ACTIVE_SCHOOL_KEY
        );

    if(!activeSchool){

        alert(
            "You must register a school first."
        );

        return;
    }

    const fullName =
        document.getElementById(
            "registerFullName"
        ).value.trim();

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value.trim();

    const role =
        document.getElementById(
            "registerRole"
        ).value;

    let users =
        JSON.parse(
            localStorage.getItem(
                USERS_KEY
            )
        ) || [];

    const existingUser =
        users.find(
            user =>
                user.username === username ||
                user.email === email
        );

    if(existingUser){

        alert(
            "User account already exists."
        );

        return;
    }

    const userPayload = {

        fullName,
        email,
        username,
        password,
        role,

        school: activeSchool,

        createdAt:
            new Date().toISOString()
    };

    users.push(userPayload);

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    alert(
        "Permanent account created successfully."
    );

    document.getElementById(
        "register-view"
    ).style.display = "none";

    document.getElementById(
        "signin-view"
    ).style.display = "block";
}

/* =========================================
   LOGIN
========================================= */

function executeSystemLogin(event){

    event.preventDefault();

    const loginValue =
        document.getElementById(
            "loginUser"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value.trim();

    const users =
        JSON.parse(
            localStorage.getItem(
                USERS_KEY
            )
        ) || [];

    const matchedUser =
        users.find(
            user =>
                (
                    user.username === loginValue ||
                    user.email === loginValue
                )
                &&
                user.password === password
        );

    if(!matchedUser){

        alert("Invalid credentials");
        return;
    }

    currentSchoolName =
        matchedUser.school;

    localStorage.setItem(
        ACTIVE_SCHOOL_KEY,
        currentSchoolName
    );

    window.currentSchoolDatabase =
        loadSchoolData(currentSchoolName);

    executeGlobalSchoolRebrand(
        currentSchoolName
    );

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "app-container"
    ).style.display = "block";

    document.getElementById(
        "header-active-role-badge"
    ).textContent =
        matchedUser.role;

    switchTab("dashboard");

    refreshEntireSystemUI();
}
    </script>
</body>
</html>
