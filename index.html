# Full Combined School Management System HTML

Replace your existing authentication and script sections with the following integrated version.

```html
<!-- SCHOOL REGISTRATION VIEW -->
<div id="school-registration-view" style="display:none;">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Register Your School</h1>
            <p>Create your school before creating accounts</p>
        </div>

        <form onsubmit="registerSchool(event)">
            <div class="form-group">
                <label>School Name</label>
                <input type="text" id="schoolRegisterName" class="form-control" required>
            </div>

            <div class="form-group">
                <label>School Email</label>
                <input type="email" id="schoolRegisterEmail" class="form-control" required>
            </div>

            <div class="form-group">
                <label>School Phone</label>
                <input type="text" id="schoolRegisterPhone" class="form-control" required>
            </div>

            <div class="form-group">
                <label>School Address</label>
                <input type="text" id="schoolRegisterAddress" class="form-control" required>
            </div>

            <button type="submit" class="btn-auth">
                Register School
            </button>
        </form>
    </div>
</div>

<!-- LOGIN VIEW -->
<div id="signin-view">

    <div style="margin-bottom:15px;text-align:right;">
        <button class="btn-action" type="button" onclick="toggleRegisterView()">
            Register Account
        </button>
    </div>

    <form onsubmit="executeSystemLogin(event)">

        <div class="form-group">
            <label>Username or Email</label>
            <input type="text" id="loginUser" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
        </div>

        <button type="submit" class="btn-auth">
            Login
        </button>
    </form>
</div>

<!-- REGISTER USER VIEW -->
<div id="register-view" style="display:none;">

    <form onsubmit="registerUser(event)">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="registerFullName" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="registerEmail" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="registerUsername" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="registerPassword" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Role</label>
            <select id="registerRole" class="form-control">
                <option value="admin">Administrator</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
                <option value="librarian">Librarian</option>
                <option value="parent">Parent</option>
            </select>
        </div>

        <button type="submit" class="btn-auth">
            Create Permanent Account
        </button>

        <div style="margin-top:15px;text-align:center;">
            <a href="#" onclick="toggleLoginView()">
                Already have an account?
            </a>
        </div>
    </form>
</div>

<script>

const SCHOOL_INDEX_KEY = "sms_school_index";
const ACTIVE_SCHOOL_KEY = "sms_active_school";
const SCHOOL_REGISTRY_KEY = "sms_registered_schools";

let currentSchoolName =
    localStorage.getItem(ACTIVE_SCHOOL_KEY) ||
    "APAPEC-IREBERO";

function createEmptySchoolDatabase(schoolName) {
    return {
        schoolName,
        students: [],
        teachers: [],
        librarians: [],
        parents: [],
        admins: [],
        books: [],
        fines: [],
        attendance: [],
        marks: [],
        classes: [],
        announcements: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };
}

function getSchoolIndex() {
    return JSON.parse(
        localStorage.getItem(SCHOOL_INDEX_KEY)
    ) || {};
}

function saveSchoolIndex(index) {
    localStorage.setItem(
        SCHOOL_INDEX_KEY,
        JSON.stringify(index)
    );
}

function loadSchoolData(schoolName) {

    const schoolIndex = getSchoolIndex();

    if (!schoolIndex[schoolName]) {

        schoolIndex[schoolName] =
            createEmptySchoolDatabase(schoolName);

        saveSchoolIndex(schoolIndex);
    }

    return schoolIndex[schoolName];
}

function saveSchoolData(schoolName, data) {

    const schoolIndex = getSchoolIndex();

    schoolIndex[schoolName] = {
        ...data,
        updatedAt: new Date().toISOString()
    };

    saveSchoolIndex(schoolIndex);
}

function executeGlobalSchoolRebrand(targetedSchoolName) {

    if (!targetedSchoolName || targetedSchoolName.trim() === "") {
        alert("School name cannot be empty.");
        return;
    }

    targetedSchoolName = targetedSchoolName.trim();

    const previousSchool = currentSchoolName;

    const currentData =
        window.currentSchoolDatabase ||
        createEmptySchoolDatabase(previousSchool);

    saveSchoolData(previousSchool, currentData);

    currentSchoolName = targetedSchoolName;

    localStorage.setItem(
        ACTIVE_SCHOOL_KEY,
        currentSchoolName
    );

    const restoredData =
        loadSchoolData(currentSchoolName);

    window.currentSchoolDatabase = restoredData;

    document.title =
        `${currentSchoolName} | School Management System & Library`;

    const brandingTargets = [
        "window-title",
        "login-brand-title",
        "sidebar-brand"
    ];

    brandingTargets.forEach(id => {
        const element = document.getElementById(id);

        if (element) {
            element.textContent = currentSchoolName;
        }
    });

    const schoolInput =
        document.getElementById("schoolNameInput");

    if (schoolInput) {
        schoolInput.value = currentSchoolName;
    }

    refreshEntireSystemUI();
}

function registerSchool(event) {

    event.preventDefault();

    const schoolName =
        document.getElementById("schoolRegisterName")
        .value.trim();

    const schoolEmail =
        document.getElementById("schoolRegisterEmail")
        .value.trim();

    const schoolPhone =
        document.getElementById("schoolRegisterPhone")
        .value.trim();

    const schoolAddress =
        document.getElementById("schoolRegisterAddress")
        .value.trim();

    let schools = JSON.parse(
        localStorage.getItem(SCHOOL_REGISTRY_KEY)
    ) || [];

    const existingSchool = schools.find(
        school =>
            school.schoolName.toLowerCase() ===
            schoolName.toLowerCase()
    );

    if (!existingSchool) {

        schools.push({
            schoolName,
            schoolEmail,
            schoolPhone,
            schoolAddress,
            createdAt: new Date().toISOString()
        });

        localStorage.setItem(
            SCHOOL_REGISTRY_KEY,
            JSON.stringify(schools)
        );
    }

    localStorage.setItem(
        ACTIVE_SCHOOL_KEY,
        schoolName
    );

    executeGlobalSchoolRebrand(schoolName);

    alert("School registered successfully.");

    document.getElementById(
        "school-registration-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";
}

function toggleRegisterView() {

    const activeSchool =
        localStorage.getItem(ACTIVE_SCHOOL_KEY);

    if (!activeSchool) {

        document.getElementById(
            "signin-view"
        ).style.display = "none";

        document.getElementById(
            "school-registration-view"
        ).style.display = "block";

        return;
    }

    document.getElementById(
        "signin-view"
    ).style.display = "none";

    document.getElementById(
        "register-view"
    ).style.display = "block";
}

function toggleLoginView() {

    document.getElementById(
        "signin-view"
    ).style.display = "block";

    document.getElementById(
        "register-view"
    ).style.display = "none";
}

function registerUser(event) {

    event.preventDefault();

    const fullName =
        document.getElementById("registerFullName").value;

    const email =
        document.getElementById("registerEmail").value;

    const username =
        document.getElementById("registerUsername").value;

    const password =
        document.getElementById("registerPassword").value;

    const role =
        document.getElementById("registerRole").value;

    let users = JSON.parse(
        localStorage.getItem("sms_users")
    ) || [];

    const existingUser = users.find(user =>
        user.username === username ||
        user.email === email
    );

    if (existingUser) {
        alert("Account already exists");
        return;
    }

    users.push({
        fullName,
        email,
        username,
        password,
        role,
        school: currentSchoolName
    });

    localStorage.setItem(
        "sms_users",
        JSON.stringify(users)
    );

    alert("Permanent account created successfully");

    toggleLoginView();
}

function executeSystemLogin(event) {

    event.preventDefault();

    const username =
        document.getElementById("loginUser").value;

    const password =
        document.getElementById("loginPassword").value;

    const users = JSON.parse(
        localStorage.getItem("sms_users")
    ) || [];

    const matchedUser = users.find(user =>
        (
            user.username === username ||
            user.email === username
        ) &&
        user.password === password
    );

    if (!matchedUser) {
        alert("Invalid login credentials");
        return;
    }

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "app-container"
    ).style.display = "block";

    document.getElementById(
        "header-active-role-badge"
    ).textContent = matchedUser.role;

    switchTab("dashboard");
}

function refreshEntireSystemUI() {

    updateDashboardStatistics?.();
    renderStudentsTable?.();
    renderTeachersTable?.();
    renderBooksTable?.();
    renderParentsTable?.();
    renderAnnouncements?.();
}

document.addEventListener(
    "DOMContentLoaded",
    () => {

        currentSchoolName =
            localStorage.getItem(ACTIVE_SCHOOL_KEY) ||
            "APAPEC-IREBERO";

        window.currentSchoolDatabase =
            loadSchoolData(currentSchoolName);

        executeGlobalSchoolRebrand(currentSchoolName);
    }
);

</script>
```
